name: Build mods

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      game_version:
        description: "Stub game version (0.107.1 = stable, 0.111.0-beta-41cef1ea = beta)"
        default: "0.107.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: ${{ github.event.inputs.game_version || '0.107.1' }}
      GODOT_VERSION: "4.5.1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} mono
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip && rm godot.zip

      - name: Build all mods
        run: |
          export DOTNET_ROOT="$(dirname "$(readlink -f "$(which dotnet)")")"
          export GODOT="$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          tools/build-all.sh "$GAME_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: sts2-mods-${{ env.GAME_VERSION }}
          path: dist/*.zip

      - name: Workshop upload kit (ModUploader + filled workspaces)
        run: |
          python3 tools/workshop/stage.py
          git clone -q https://github.com/megacrit/sts2-mod-uploader.git /tmp/uploader
          git -C /tmp/uploader checkout -q d7b7e6b16c413d5a124f474f9e5104ef01f76ab1
          dotnet publish /tmp/uploader/ModUploader.csproj -c Release -r win-x64 --self-contained true -o /tmp/kit/ModUploader
          rm -f /tmp/kit/ModUploader/*.pdb
          cp -r workshop/Golem workshop/CardSharp workshop/Bard /tmp/kit/
          for M in Golem CardSharp Bard; do
            printf '@echo off\r\nrem Steam must be running and logged in.\r\ncd /d "%%~dp0"\r\nModUploader\\ModUploader.exe upload -w %s\r\npause\r\n' "$M" > /tmp/kit/upload-$M.bat
          done
          cat > /tmp/kit/upload-all.bat <<'BAT'
          @echo off
          rem Steam must be running and logged in. Uploads/updates all three mods.
          cd /d "%~dp0"
          for %%M in (Golem CardSharp Bard) do ModUploader\ModUploader.exe upload -w %%M
          echo.
          echo Done. Copy the new mod_id.txt files back into the repo's workshop folders (first upload only).
          pause
          BAT

      - uses: actions/upload-artifact@v4
        with:
          name: workshop-upload-kit
          path: /tmp/kit

      - name: Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
