<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760">
<defs>
  <!--FILTERS-->
  <radialGradient id="bg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#5a4a3a"/><stop offset="0.55" stop-color="#2c241d"/><stop offset="1" stop-color="#110e0b"/>
  </radialGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a3b2c"/><stop offset="1" stop-color="#1c1610"/>
  </linearGradient>
  <radialGradient id="rock" cx="35%" cy="30%" r="80%">
    <stop offset="0" stop-color="#9a8a76"/><stop offset="0.45" stop-color="#6b5b4a"/><stop offset="1" stop-color="#2e261e"/>
  </radialGradient>
  <radialGradient id="clay" cx="35%" cy="25%" r="85%">
    <stop offset="0" stop-color="#a87d5a"/><stop offset="0.5" stop-color="#7a5539"/><stop offset="1" stop-color="#3a2618"/>
  </radialGradient>
  <radialGradient id="moss" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7c8a4a"/><stop offset="1" stop-color="#4b5a2c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ember" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#fff2b0"/><stop offset="0.35" stop-color="#ffb43a"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9a5a30"/><stop offset="0.5" stop-color="#6e3a1c"/><stop offset="1" stop-color="#3a1e0e"/>
  </linearGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/>
  </radialGradient>
</defs>

<g filter="url(#paint)">
  <rect x="-60" y="-60" width="1120" height="880" fill="url(#bg)"/>
  <!-- distant cave pillars -->
  <path d="M0 0 L130 0 L95 520 L0 560 Z" fill="#1d1712" opacity="0.8"/>
  <path d="M1000 0 L860 0 L900 500 L1000 540 Z" fill="#1d1712" opacity="0.8"/>
  <path d="M180 0 L240 0 L225 300 L190 330 Z" fill="#2a221b" opacity="0.6"/>
  <path d="M770 0 L820 0 L810 280 L780 300 Z" fill="#2a221b" opacity="0.6"/>
  <!-- ground -->
  <path d="M0 560 Q500 500 1000 560 L1000 760 L0 760 Z" fill="url(#ground)"/>

  <!-- shockwave rings + glowing cracks -->
  <ellipse cx="500" cy="640" rx="420" ry="70" fill="none" stroke="#e8a050" stroke-width="5" opacity="0.35"/>
  <ellipse cx="500" cy="640" rx="300" ry="50" fill="none" stroke="#ffc070" stroke-width="7" opacity="0.5"/>
  <g stroke="#ff9a30" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M500 640 L380 690 L300 680 L220 720"/>
    <path d="M500 640 L620 700 L700 690 L790 735"/>
    <path d="M500 640 L470 720 L490 760"/>
    <path d="M500 640 L560 600 L650 610"/>
    <path d="M500 640 L430 605 L360 615"/>
  </g>
  <ellipse cx="500" cy="640" rx="170" ry="40" fill="url(#ember)" opacity="0.85" filter="url(#glow)"/>

  <!-- flying rock shards and mud -->
  <g fill="url(#rock)">
    <path d="M250 560 l30 -25 l25 12 l-8 30 z"/><path d="M760 548 l26 -20 l22 18 l-14 24 z"/>
    <path d="M330 470 l18 -16 l16 8 l-6 20 z"/><path d="M690 455 l20 -14 l14 14 l-12 16 z"/>
    <path d="M200 610 l24 -10 l10 18 l-20 10 z"/><path d="M800 605 l22 -8 l8 20 l-22 6 z"/>
  </g>
  <g fill="#4a3424"><circle cx="300" cy="520" r="9"/><circle cx="720" cy="505" r="11"/><circle cx="410" cy="430" r="6"/><circle cx="610" cy="420" r="7"/><circle cx="845" cy="560" r="8"/><circle cx="160" cy="575" r="7"/></g>

  <!-- GOLEM -->
  <!-- legs -->
  <path d="M390 560 Q370 610 360 650 L440 655 Q445 610 450 560 Z" fill="url(#clay)"/>
  <path d="M560 560 Q575 610 585 650 L505 655 Q505 610 500 560 Z" fill="url(#clay)"/>
  <!-- torso: big boulder -->
  <ellipse cx="480" cy="420" rx="190" ry="170" fill="url(#rock)"/>
  <ellipse cx="420" cy="350" rx="70" ry="40" fill="url(#moss)" opacity="0.9"/>
  <ellipse cx="560" cy="470" rx="60" ry="30" fill="url(#moss)" opacity="0.7"/>
  <!-- iron bands -->
  <path d="M300 400 Q480 450 665 395" stroke="url(#iron)" stroke-width="22" fill="none"/>
  <path d="M320 480 Q480 520 650 470" stroke="url(#iron)" stroke-width="16" fill="none"/>
  <g fill="#c98a4a"><circle cx="360" cy="420" r="6"/><circle cx="450" cy="436" r="6"/><circle cx="540" cy="432" r="6"/><circle cx="620" cy="412" r="6"/></g>
  <!-- glowing cracks in torso -->
  <g stroke="#ffa63a" stroke-width="5" fill="none" opacity="0.9">
    <path d="M470 300 L490 340 L475 375 L495 400"/><path d="M560 330 L540 360 L555 385"/>
  </g>
  <!-- head boulder -->
  <ellipse cx="480" cy="225" rx="85" ry="72" fill="url(#rock)"/>
  <path d="M410 200 Q480 170 555 200" stroke="#2e261e" stroke-width="10" fill="none" opacity="0.6"/>
  <!-- ember eye -->
  <circle cx="490" cy="235" r="48" fill="url(#ember)" filter="url(#glow)"/>
  <circle cx="490" cy="235" r="15" fill="#fff0b0"/>
  <circle cx="490" cy="235" r="8" fill="#ffffff"/>
  <!-- shoulders -->
  <circle cx="300" cy="330" r="62" fill="url(#rock)"/>
  <circle cx="665" cy="330" r="62" fill="url(#rock)"/>
  <!-- arms raised then down: two huge clay fists slamming the ground -->
  <path d="M265 350 Q210 450 300 560 L370 545 Q310 450 335 365 Z" fill="url(#clay)"/>
  <path d="M700 350 Q760 450 670 560 L600 545 Q660 450 630 365 Z" fill="url(#clay)"/>
  <ellipse cx="340" cy="590" rx="80" ry="58" fill="url(#rock)"/>
  <ellipse cx="635" cy="590" rx="80" ry="58" fill="url(#rock)"/>
  <path d="M290 590 Q340 560 395 590" stroke="url(#iron)" stroke-width="12" fill="none"/>
  <path d="M585 590 Q635 560 690 590" stroke="url(#iron)" stroke-width="12" fill="none"/>
  <!-- dripping mud -->
  <g fill="#4a3020">
    <path d="M300 520 q6 30 0 45 q-6 -15 0 -45z"/><path d="M660 515 q6 30 0 48 q-6 -18 0 -48z"/>
    <path d="M430 580 q5 25 0 40 q-5 -15 0 -40z"/><path d="M540 585 q5 22 0 36 q-5 -14 0 -36z"/>
  </g>
  <!-- rim light -->
  <path d="M300 300 Q480 210 665 300" stroke="#ffcf8a" stroke-width="5" fill="none" opacity="0.4"/>
  <!-- dust -->
  <ellipse cx="500" cy="660" rx="460" ry="60" fill="#8a7055" opacity="0.18" filter="url(#glow)"/>
</g>
<rect width="1000" height="760" fill="url(#vig)"/>
</svg>
